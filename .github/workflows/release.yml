# Builds installers for Windows, macOS and Linux and attaches them to the GitHub Release of the pushed tag.
# Installers are UNSIGNED (no certificates are configured); see README, "Unsigned apps".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload files; nothing else

jobs:
  create-release:
    name: Create the release for this tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Create the release if it does not exist yet (built-in GitHub CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "ResistanceScope $GITHUB_REF_NAME" --generate-notes \
                 --notes "Unsigned installers: see the README section 'Unsigned apps' for how to open them. Educational use only; not for clinical decisions."

  build:
    name: Build installers (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package and upload installers to the release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # never look for signing certificates

  checksums:
    name: Attach SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the installers, hash them and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb'
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
